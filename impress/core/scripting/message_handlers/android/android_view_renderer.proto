// web.proto
// Defines messages for communication between JS and C++.

syntax = "proto3";

package imp.android;

import "core/math/math.proto";
import "core/ncsb/node_handle_message.proto";
import "core/proto/imp.proto";
import "core/view/framework/render/material_definition.proto";

option java_package = "com.google.ar.imp.core";

enum InputForwardingMode {
  // If INPUT_FORWARDING_MODE_NONE is used, inputs are not forwarded.
  INPUT_FORWARDING_MODE_NONE = 0;
  // If INPUT_FORWARDING_MODE_DEFAULT is used, PointerHitEvent will be forwarded
  // to Android View as touch events.
  INPUT_FORWARDING_MODE_DEFAULT = 1;
}

// Create a node that renders an Android View to texture on a quad.
message CreateSurfaceTextureQuadRequest {
  // The node on which to attach the view quad.
  imp.NodeHandleMessage target = 1;

  // Specifies how inputs are forwarded to Android View
  InputForwardingMode input_forwarding_mode = 2;

  // The width of the virtual display that the View will be rendered to.
  int32 width = 3;

  // The height of the virtual display that the View will be rendered to.
  int32 height = 4;

  // The material to use for the quad. If not specified, a default material
  // will be used.
  MaterialDefinition material = 5 [(imp.optional_type) = ABSL_OPTIONAL];

  // The blend priority for the quad. If not specified, a default priority
  // will be used.
  uint32 blend_priority = 6 [(imp.optional_type) = ABSL_OPTIONAL];
}

// Request to get the jobject of the View that this node is attached to, if any.
message GetAttachedViewRequest {
  imp.NodeHandleMessage target = 1;
}

// Request to update the collider of the Android View.
message UpdateSurfaceTextureQuadColliderRequest {
  // The node on which to attach the view quad.
  imp.NodeHandleMessage target = 1;

  // The collider to use for the quad.
  imp.Box collider = 2;
}
