// web.proto
// Defines messages for communication between JS and C++.

syntax = "proto3";

package imp.scripting;

import "google/protobuf/any.proto";
import "core/ncsb/node_handle_message.proto";

// option cc_api_version = 2;
// option cc_api_version = 2;
option java_package = "com.google.ar.imp.core.scripting";

// Makes a request to add a listener to the given event type.
message EventListenerAddRequest {
  imp.NodeHandleMessage target = 1;
  // Expected to be in the format type.googleapis.com/packagename.messagename
  string event_type_url = 2;
}

// Returns the unique connection ID that tracks this listener.
message EventListenerAddResponse {
  uint32 listener_id = 1;
}

// Requests to disconnect a previously-registered event listener.
message EventListenerRemoveRequest {
  uint32 listener_id = 1;
}

// A wrapper for events so they can be routed to the right listener.
message EventListenerMessage {
  uint32 listener_id = 1;
  google.protobuf.Any event = 2;
}

// An event wrapper with a node target for sending node-specific events.
message NodeEvent {
  imp.NodeHandleMessage target = 1;
  google.protobuf.Any event = 2;
}
