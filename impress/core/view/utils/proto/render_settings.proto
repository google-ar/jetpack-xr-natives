// Defines the proto for render settings
// For now, it's only intended to be used by SwapChainRenderer

syntax = "proto3";

package imp.render_settings;

import "core/math/math.proto";
import "core/proto/imp.proto";

// option cc_api_version = 2;
option java_package = "com.google.ar.imp.core";

// See third_party/filament/filament/include/filament/Options.h for the c++
// definitions and default values of these settings.

enum QualityLevel {
  QUALITY_LEVEL_UNDEFINED = 0;
  QUALITY_LEVEL_LOW = 1;
  QUALITY_LEVEL_MEDIUM = 2;
  QUALITY_LEVEL_HIGH = 3;
  QUALITY_LEVEL_ULTRA = 4;
}

enum BlendMode {
  BLEND_MODE_UNDEFINED = 0;
  BLEND_MODE_OPAQUE = 1;
  BLEND_MODE_TRANSLUCENT = 2;
}

enum AntiAliasing {
  ANTI_ALIASING_NONE = 0;
  ANTI_ALIASING_FXAA = 1;
}

enum Dithering {
  DITHERING_NONE = 0;
  DITHERING_TEMPORAL = 1;
}

enum ShadowType {
  SHADOW_TYPE_UNDEFINED = 0;
  SHADOW_TYPE_PCF = 1;
  SHADOW_TYPE_VSM = 2;
  SHADOW_TYPE_DPCF = 3;
  SHADOW_TYPE_PCSS = 4;
}

// This enum can be used to specify the override mode.
// Override settings will be applied on top of the base values.
// If override_mode is OVERRIDE_MODE_OVERRIDE_CURRENT, then the current setting
// values will be used as the base values. If override_mode is
// OVERRIDE_MODE_OVERRIDE_FROM_SOURCE, then the source (the other instance that
// we're copying from) settings values will be used as the base values.
enum OverrideMode {
  OVERRIDE_MODE_OVERRIDE_CURRENT = 0;
  OVERRIDE_MODE_OVERRIDE_FROM_SOURCE = 1;
}

message DynamicResolutionOptions {
  Float2 min_scale = 1 [(imp.optional_type) = ABSL_OPTIONAL];
  Float2 max_scale = 2 [(imp.optional_type) = ABSL_OPTIONAL];
  optional float sharpness = 3;
  optional bool enabled = 4;
  optional bool homogeneous_scaling = 5;
  optional QualityLevel quality = 6;
}

message BloomOptions {
  enum BloomBlendMode {
    BLOOM_BLEND_MODE_UNDEFINED = 0;
    BLOOM_BLEND_MODE_ADD = 1;
    BLOOM_BLEND_MODE_INTERPOLATE = 2;
  }

  // Texture* dirt = nullptr;å
  optional float dirt_strength = 1;
  optional float strength = 2;
  optional uint32 resolution = 3;
  optional float anamorphism = 4;
  optional uint32 levels = 5;
  optional BloomBlendMode blend_mode = 6;
  optional bool threshold = 7;
  optional bool enabled = 8;
  optional float highlight = 9;
  optional bool lens_flare = 10;
  optional bool starburst = 11;
  optional float chromatic_aberration = 12;
  optional uint32 ghost_count = 13;
  optional float ghost_spacing = 14;
  optional float ghost_threshold = 15;
  optional float halo_thickness = 16;
  optional float halo_radius = 17;
  optional float halo_threshold = 18;
}

message FogOptions {
  optional float distance = 1;
  optional float maximum_opacity = 2;
  optional float height = 3;
  optional float height_falloff = 4;
  Float3 color = 5 [(imp.optional_type) = ABSL_OPTIONAL];
  optional float density = 6;
  optional float in_scattering_start = 7;
  optional float in_scattering_size = 8;
  optional bool fog_color_from_ibl = 9;
  optional bool enabled = 10;
}

message DepthOfFieldOptions {
  enum Filter {
    FILTER_NONE = 0;
    FILTER_UNUSED = 1;
    FILTER_MEDIAN = 2;
  }

  optional float coc_scale = 1;
  optional float max_aperture_diameter = 2;
  optional bool enabled = 3;
  optional Filter filter = 4;
  optional bool native_resolution = 5;
  optional uint32 foreground_ring_count = 6;
  optional uint32 background_ring_count = 7;
  optional uint32 fast_gather_ring_count = 8;
  optional uint32 max_foreground_coc = 9;
  optional uint32 max_background_coc = 10;
}

message VignetteOptions {
  optional float mid_point = 1;
  optional float roundness = 2;
  optional float feather = 3;
  Float4 color = 4 [(imp.optional_type) = ABSL_OPTIONAL];
  optional bool enabled = 5;
}

message RenderQuality {
  QualityLevel hdr_color_buffer = 1;
}

message ScreenSpaceConeTracingOptions {
  optional float light_cone_rad = 1;
  optional float shadow_distance = 2;
  optional float contact_distance_max = 3;
  optional float intensity = 4;
  Float3 light_direction = 5 [(imp.optional_type) = ABSL_OPTIONAL];
  optional float depth_bias = 6;
  optional float depth_slope_bias = 7;
  optional uint32 sample_count = 8;
  optional uint32 ray_count = 9;
  optional bool enabled = 10;
}

message AmbientOcclusionOptions {
  optional float radius = 1;
  optional float power = 2;
  optional float bias = 3;
  optional float resolution = 4;
  optional float intensity = 5;
  optional float bilateral_threshold = 6;
  optional QualityLevel quality = 7;
  optional QualityLevel low_pass_filter = 8;
  optional QualityLevel upsampling = 9;
  optional bool enabled = 10;
  optional bool bent_normals = 11;
  optional float min_horizon_angle_rad = 12;
  ScreenSpaceConeTracingOptions ssct = 13 [(imp.optional_type) = ABSL_OPTIONAL];
}

message TemporalAntiAliasingOptions {
  optional float filter_width = 1;
  optional float feedback = 2;
  optional bool enabled = 3;
}

message MultiSampleAntiAliasingOptions {
  optional bool enabled = 1;
  optional uint32 sample_count = 2;
  optional bool custom_resolve = 3;
}

message VsmShadowOptions {
  optional uint32 anisotropy = 1;
  optional bool mipmapping = 2;
  optional float min_variance_scale = 3;
  optional float light_bleed_reduction = 4;
}

message SoftShadowOptions {
  optional float penumbra_scale = 1;
  optional float penumbra_ratio_scale = 2;
}

message ScreenSpaceReflectionsOptions {
  optional float thickness = 1;
  optional float bias = 2;
  optional float max_distance = 3;
  optional float stride = 4;
  optional bool enabled = 5;
}

message GuardBandOptions {
  optional bool enabled = 1;
}

// See google3/third_party/filament/filament/include/filament/ColorGrading.h
// for definitions and default values of these settings
message ColorGrading {
  enum LutFormat {
    LUT_FORMAT_UNDEFINED = 0;
    LUT_FORMAT_INTEGER = 1;
    LUT_FORMAT_FLOAT = 2;
  }

  enum ToneMappingMode {
    TONE_MAPPING_MODE_UNDEFINED = 0;
    TONE_MAPPING_MODE_LINEAR = 1;
    TONE_MAPPING_MODE_ACES = 2;
    TONE_MAPPING_MODE_ACES_LEGACY = 3;
    TONE_MAPPING_MODE_FILMIC = 4;
    TONE_MAPPING_MODE_GENERIC = 5;
  }

  message ToneMapper {
    ToneMappingMode mode = 1;
    // The following options are only for TONE_MAPPING_MODE_GENERIC
    optional float contrast = 2;
    optional float mid_gray_in = 3;
    optional float mid_gray_out = 4;
    optional float hdr_max = 5;
  }

  message WhiteBalance {
    float temperature = 1;
    float tint = 2;
  }

  message ChannelMixer {
    Float3 out_red = 1;
    Float3 out_green = 2;
    Float3 out_blue = 3;
  }

  message SlopeOffsetPower {
    Float3 slope = 1;
    Float3 offset = 2;
    Float3 power = 3;
  }

  message ShadowsMidtonesHighlights {
    Float4 shadows = 1;
    Float4 midtones = 2;
    Float4 highlights = 3;
    Float4 ranges = 4;
  }

  message Curve {
    Float3 shadow_gamma = 1;
    Float3 mid_point = 2;
    Float3 highlight_scale = 3;
  }

  optional QualityLevel quality = 1;
  optional LutFormat format = 2;
  optional uint32 dimensions = 3;
  ToneMapper tone_mapper = 4 [(imp.optional_type) = ABSL_OPTIONAL];
  optional bool luminance_scaling = 5;
  optional bool gamut_mapping = 6;
  optional float exposure = 7;
  optional float night_adaptation = 8;
  WhiteBalance white_balance = 9 [(imp.optional_type) = ABSL_OPTIONAL];
  ChannelMixer channel_mixer = 10 [(imp.optional_type) = ABSL_OPTIONAL];
  ShadowsMidtonesHighlights shadows_midtones_highlights = 11
      [(imp.optional_type) = ABSL_OPTIONAL];
  SlopeOffsetPower slope_offset_power = 12
      [(imp.optional_type) = ABSL_OPTIONAL];
  optional float contrast = 13;
  optional float vibrance = 14;
  optional float saturation = 15;
  Curve curves = 16 [(imp.optional_type) = ABSL_OPTIONAL];
}

message ViewRenderSettings {
  optional bool post_processing_enabled = 1;
  optional AntiAliasing anti_aliasing = 2;
  optional Dithering dithering = 3;
  RenderQuality render_quality = 4 [(imp.optional_type) = ABSL_OPTIONAL];
  ColorGrading color_grading = 5 [(imp.optional_type) = ABSL_OPTIONAL];
  optional bool shadowing_enabled = 6;
  // TODO: Add support for the following settings.
  /*  optional bool front_face_winding_inverted = 2;
    optional bool frustum_culling_enabled = 3;
    optional BlendMode blend_mode = 8;
    optional ShadowType shadow_type = 9;
    optional DynamicResolutionOptions dynamic_resolution_options = 10;
    optional BloomOptions bloom_options = 11;
    optional FogOptions fog_options = 12;
    optional DepthOfFieldOptions depth_of_field_options = 13;
    optional VignetteOptions vignette_options = 14;
    optional AmbientOcclusionOptions ambient_occlusion_options = 15;
    optional TemporalAntiAliasingOptions temporal_anti_aliasing_options = 16;
    optional MultiSampleAntiAliasingOptions multi_sample_anti_aliasing_options =
        17;
    optional VsmShadowOptions vsm_shadow_options = 18;
    optional SoftShadowOptions soft_shadow_options = 19;
    optional ScreenSpaceReflectionsOptions screen_space_reflections_options =
    20; optional GuardBandOptions guard_band_options = 21; */
}
