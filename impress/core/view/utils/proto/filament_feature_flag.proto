syntax = "proto3";

package imp;

option java_multiple_files = true;
// option cc_api_version = 2;
option java_outer_classname = "FilamentFeatureFlagProto";
option java_package = "com.google.ar.imp.core";

// Defines calls equivalent to filament::Engine::setFeatureFlag, executed when
// the Impress View is constructed.
message FilamentFeatureFlag {
  // The name of the feature flag.
  string name = 1;
  // Whether the feature flag is enabled.
  bool enabled = 2;
}
