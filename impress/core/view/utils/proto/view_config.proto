// Defines the proto for render settings
// For now, it's only intended to be used by SwapChainRenderer

syntax = "proto3";

package imp;

import "core/proto/imp.proto";
import "core/view/utils/proto/cache_config.proto";
import "core/view/utils/proto/filament_feature_flag.proto";
import "core/view/utils/proto/render_settings.proto";

// option cc_api_version = 2;
option java_package = "com.google.ar.imp.core";
option java_multiple_files = true;

// Defines temporary flags used for testing code in development.
message ExperimentalFeatureFlags {
  // OWNERS: eugenecys
  // BUG: b/452459028
  // PLATFORMS: ANDROID
  // ACTION: Clean up by 2026-01-17
  optional bool glyph_atlas_use_hardware_rendering = 1;

  // OWNERS: eugenecys
  // BUG: b/385221395
  // PLATFORMS: ANDROID
  // ACTION: Clean up by 2026-01-17
  optional bool glyph_atlas_force_reset_on_view_resumed = 2;

  // OWNERS: eugenecys, exv
  // BUG: b/454131370
  // PLATFORMS: ANDROID
  // ACTION: Clean up by 2026-01-24
  optional bool glyph_atlas_force_auto_method_rendering = 3;

  // OWNERS: artyompp
  // BUG: b/469883152
  // PLATFORMS: ANDROID
  // ACTION: Clean up by 2026-02-26
  optional bool surface_texture_memory_leak_fix = 4;

  // OWNERS: faaland
  // BUG: b/361658541
  // PLATFORMS: IOS
  // ACTION: Clean up by 2026-06-01
  optional bool enable_set_presentation_time = 5;
}

message ViewConfig {
  enum ShaderCachingMode {
    SHADER_CACHING_MODE_UNSPECIFIED = 0;
    SHADER_CACHING_MODE_ENABLED = 1;
    SHADER_CACHING_MODE_DISABLED = 2;
  }

  enum DefaultLightingLoading {
    DEFAULT_LIGHTING_LOADING_UNSPECIFIED = 0;
    DEFAULT_LIGHTING_LOADING_ENABLED = 1;
    DEFAULT_LIGHTING_LOADING_DISABLED = 2;
  }

  render_settings.ViewRenderSettings main_view_render_settings = 1
      [(imp.optional_type) = ABSL_OPTIONAL];
  ShaderCachingMode shader_caching_mode = 2;
  DefaultLightingLoading default_lighting_loading = 3;

  // The amount of time the foreground executor will pump per frame.
  optional float foreground_executor_timeout_ms = 4;

  // The amount of time the background executor will pump per frame if Impress
  // is using a background executor that requires explicit pumping.
  optional float background_executor_timeout_ms = 5;

  // If true, use the system's own frame scheduled handler instead of providing
  // a callback handler to Filament.
  optional bool use_system_frame_scheduled_handler = 6;

  // The size of the texture used by the GlyphAtlas.
  enum GlyphAtlasTextureSize {
    // A 2048x2048 texture size.
    SIZE2048 = 0;
    // A 2048x4096 texture size.
    SIZE2048X4096 = 1;
    // A 4096x4096 texture size.
    SIZE4096 = 2;
    // A 8x8 grid of 256x256 textures (2048x2048 total).
    SIZE256X256X8X8 = 3;
  }

  // The size of the texture used by the GlyphAtlas. The default is SIZE2048,
  // which is 2048x2048.
  GlyphAtlasTextureSize glyph_atlas_texture_size = 7
      [(imp.optional_type) = ABSL_OPTIONAL];

  CacheConfig cache_config = 9 [(imp.optional_type) = ABSL_OPTIONAL];

  // If true, imp::Future will attempt to synchronously complete all pending
  // work upon cancellation and/or destruction.
  // What this means practically is that futures scheduled on the foreground
  // (imp::SimpleExecutor) executor will be guaranteed to have a result when
  // either the future is cancelled or its last reference is released. It also
  // means that any held imp::Holdable or captured objects will be released
  // after either cancellation or destruction.
  // This behavior only applies to Executors that have implemented
  // imp::Executor::InvokeScheduledTask().
  optional bool enable_synchronous_future_cancellation = 10;

  // Defines calls equivalent to filament::Engine::setFeatureFlag, executed when
  // the Impress View is constructed.
  repeated FilamentFeatureFlag filament_feature_flags = 11;

  // Defines temporary flags for impress code in development.
  optional ExperimentalFeatureFlags experimental_feature_flags = 12;
}
