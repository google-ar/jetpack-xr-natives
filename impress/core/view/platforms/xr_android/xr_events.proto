syntax = "proto3";

package imp;

import "core/proto/imp.proto";

option java_multiple_files = true;

message XrViewStateChangedEvent {
  option (imp.is_event) = true;

  message ViewState {
    // Indicates a change to the view tracking status as reported by
    // xrLocateViews. See
    // https://registry.khronos.org/OpenXR/specs/1.0/man/html/XrViewStateFlagBits.html
    // for more detailed documentation.
    bool is_orientation_valid = 1;
    bool is_position_valid = 2;
    bool is_orientation_tracked = 3;
    bool is_position_tracked = 4;
  }
  ViewState view_state = 1 [(imp.optional_type) = ABSL_OPTIONAL];
}

// Message that is sent right before we advance & render (or skip) each frame.
message XrPreAdvanceFrameEvent {
  option (imp.is_event) = true;

  // The reason a frame was skipped.
  enum XrFrameSkippedReason {
    UNKNOWN = 0;
    HIDDEN = 1;
    SHOULD_RENDER_IS_FALSE = 2;
    UNABLE_TO_OBTAIN_POSE = 3;
  }

  // If unset, the frame, will be advanced and rendered normally.
  // If set, details the reason that the frame will be skipped.
  optional XrFrameSkippedReason frame_skipped_reason = 1;
}
