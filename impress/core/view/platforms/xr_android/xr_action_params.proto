syntax = "proto3";

package imp;

option java_multiple_files = true;

// Corresponds with XrActionCreateInfo:
// https://registry.khronos.org/OpenXR/specs/1.0/html/xrspec.html#XrActionCreateInfo
message XrActionParams {
  enum ActionType {
    NOT_SET = 0;
    BOOLEAN_INPUT = 1;
    FLOAT_INPUT = 2;
    VECTOR2F_INPUT = 3;
    POSE_INPUT = 4;  // Note that these will be become Impress-equivalent
                     // Transform<float> input actions.
    HAPTIC_OUTPUT = 5;
  }
  string action_name = 1;  // Must be unique in each action set.
  string localized_action_name = 2;
  string action_set_name =
      3;  // Must refer to a corresponding XrActionSetParams::action_set_name
  ActionType action_type = 4;
  repeated string subaction_paths = 5;
}

// Corresponds with XrActionSetCreateInfo:
// https://registry.khronos.org/OpenXR/specs/1.0/html/xrspec.html#XrActionSetCreateInfo
message XrActionSetParams {
  string action_set_name = 1;  // Must be unique in each XrSession.
  string localized_action_set_name = 2;
  uint32 priority = 3;
}

// Corresponds with XrActionSuggestedBinding:
// https://registry.khronos.org/OpenXR/specs/1.0/html/xrspec.html#XrActionSuggestedBinding
message XrActionBindingParams {
  string action_name =
      1;  // Must refer to a corresponding XrActionParams::action_name.
  string binding_path = 2;
}

// Roughly corresponds to XrInteractionProfileSuggestedBinding, with the notable
// difference that an action set name common to all XrActionBindingParams is
// specified.
// https://registry.khronos.org/OpenXR/specs/1.0/html/xrspec.html#XrInteractionProfileSuggestedBinding
message XrActionSetBindingParams {
  string action_set_name =
      1;  // Must refer to a corresponding XrActionSetParams::action_set_name
  string interaction_profile_path = 2;
  repeated XrActionBindingParams action_binding_params = 3;
}
