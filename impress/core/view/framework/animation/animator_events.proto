syntax = "proto3";

package imp;

import "core/proto/imp.proto";

// Event sent when the GltfAnimator begins playing.
// Sent to the node that the animator is attached to and can bubble.
message PlaybackStartedEvent {
  option (imp.is_event) = true;

  // The index of the animation in the glTF asset.
  int32 animation_index = 1;
}

// Event sent when the GltfAnimator finishes playing or is manually interrupted
// for any reason before the animation naturally finishes.
//
// NOTE: If a new animation playback is started on the GltfAnimator with the
// same animation index as another animation that is currently running, then
// this event will be fired for the previously running animation playback before
// the `PlaybackStartedEvent` for the new animation playback is fired.
//
// Sent to the node that the animator is attached to and can bubble.
message PlaybackEndedEvent {
  option (imp.is_event) = true;

  enum Cause {
    UNKNOWN = 0;
    // Indicates that playback ended because the animation reached the end.
    // This won't happen if the animation is looping.
    COMPLETED = 1;
    // Indicates that playback ended because Stop() was called.
    STOPPED = 2;
  }
  Cause cause = 1;

  // The index of the animation in the glTF asset.
  int32 animation_index = 2;
}

// Event sent when the GltfAnimator when the animation loops.
// Only sent if the animation is played with looping set to true.
// Sent to the node that the animator is attached to and can bubble.
message PlaybackLoopedEvent {
  option (imp.is_event) = true;

  // Represents the number of loops that have occurred. This will be 1 the
  // first time the event is fired during playback.
  uint32 loop_count = 1;

  // The index of the animation in the glTF asset.
  int32 animation_index = 2;
}

// Event sent every frame each node targeted by the animation, which first
// need to be created by GetOrCreateNode(). The node's TRS will be updated to
// the new frame.
// This event does not bubble.
message PlaybackUpdatedEvent {
  option (imp.is_event) = true;

  // The index of the animation in the glTF asset.
  int32 animation_index = 1;

  // The delta between the current animation playback time and the previous
  // animation playback time the animation was updated to.
  float delta_playback_seconds = 2;
}
