syntax = "proto3";

package imp;

import "core/math/math.proto";

// Serialized data for ColliderComponent.
message BoxColliderState {
  // The Filament Box that represents the AABB of the node.
  Box box = 1;
  int32 mask = 2;
}

// Serialized data for ColliderComponent.
message SphereColliderState {
  Float3 center = 1;
  float radius = 2;
  int32 mask = 3;
}

// Serialized data for ColliderComponent.
message CapsuleColliderState {
  Float3 center = 1;
  float height = 2;
  float radius = 3;
  int32 mask = 4;
}

// Serialized data for ColliderComponent.
message MeshColliderState {
  // Determine how to handle meshes without mesh data available on CPU.
  enum ColliderMode {
    // This mode ignores any mesh whose data is not stored on CPU.
    COLLIDE_WITH_MESH_ONLY_DEFAULT = 0;
    // This mode uses the AABB as a substitute for meshes whose data is not
    // stored on CPU.
    COLLIDE_WITH_MESH_OR_AABB_SUBSTITUTE = 1;
  }

  // If unassigned, the collider mode is COLLIDE_WITH_MESH_ONLY_DEFAULT
  optional ColliderMode collider_mode = 1;
}
