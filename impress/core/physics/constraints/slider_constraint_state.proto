syntax = "proto3";

package imp;

import "core/math/math.proto";
import "core/proto/imp.proto";
import "core/scene_handles/scene_handles.proto";

message SliderConstraintState {
  // The node that holds a rigid body A that is subject to this constraint.
  NodeSceneHandle connected_node = 1;

  // The pivot of the constraint frame in the connected node(that holds rigid
  // body A)'s local space.
  Float3 connected_pivot = 2;

  // The axis of the constraint frame in the connected node(that holds rigid
  // body A)'s local space.
  Float3 connected_axis = 3;

  // The up axis of the constraint frame in the connected node(that holds rigid
  // body A)'s local space. Together withe the axis, it defines the constraint
  // rotation.
  Float3 connected_up_axis = 4;

  // Only used when the constraint is between two rigid bodies. Indicates the
  // pivot/offset of the constraint frame from rigid body (B). Note that rigid
  // body (B) is attached the same node that owns the constraint.
  Float3 pivot = 5 [(imp.optional_type) = ABSL_OPTIONAL];

  // The rotation for the constraint frame from rigid body (B).
  Float3 axis = 6 [(imp.optional_type) = ABSL_OPTIONAL];
  Float3 up_axis = 7 [(imp.optional_type) = ABSL_OPTIONAL];

  // if it will calculate the connected pivot and axis based on the transforms
  // of the two rigid bodies. If there is only one rigid body (the connected
  // node), the pivot and axiswill be interpreted as the world transform of the
  // constraint.
  bool auto_configure = 8;

  // The limits for the angular movement
  float angular_lower_limit = 9;
  float angular_upper_limit = 10;

  // The limits for the linear movement
  float linear_lower_limit = 11;
  float linear_upper_limit = 12;

  // The force and desired velocity for the linear motor
  float max_linear_motor_force = 13;
  float max_linear_motor_velocity = 14;

  // The torque and desired velocity for the angular motor
  float max_angular_motor_force = 15;
  float max_angular_motor_velocity = 16;

  // The parameters for hitting the linear limits
  float softness_linear_limit = 17;
  float restitution_linear_limit = 18;
  float damping_linear_limit = 19;

  // The parameters for hitting the angular limits
  float softness_angular_limit = 20;
  float restitution_angular_limit = 21;
  float damping_angular_limit = 22;

  // The parameters for moving against the constraint axis (on orthogonal axes)
  float softness_ortho_linear_limit = 23;
  float restitution_ortho_linear_limit = 24;
  float damping_ortho_linear_limit = 25;

  // The parameters for rotating against the constraint axis (on orthogonal
  // axes)
  float softness_ortho_angular_limit = 26;
  float restitution_ortho_angular_limit = 27;
  float damping_ortho_angular_limit = 28;

  // If the constraint is ready (is it functioning, ie it is connected to valid
  // rigid bodies)
  bool is_ready = 29 [(imp.editor_control) = { read_only: {} }];
}
