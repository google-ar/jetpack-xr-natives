syntax = "proto3";

package imp.physics;

// Decides the shape of underlying physics collider.
enum CollidableType {
  // Let the program decides.
  AUTOMATIC_DEFAULT = 0;
  // The collidable is primitive defined by functions, has high resolution.
  PRIMITIVE = 1;
  // The collidable is a convex hull of the visible meshes. To use this type,
  // the mesh must be watertight, the mesh data must be loaded to CPU.
  CONVEX_HULL = 2;
  // The collidable is of the exact shape of the visible triangle meshes. To
  // use this type, the mesh must be watertight, the mesh data must be loaded
  // to CPU, the colliable will be static and cannot be moved.
  TRIANGLE_MESH_STATIC_ONLY = 3;
}
