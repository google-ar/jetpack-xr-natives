edition = "2023";

package imp.split_engine;

import "google/rpc/status.proto";
import "core/split_engine/desktop/split_engine_desktop_bridge.proto";

// <MM> is for Multi Machine
service SplitEngineMMDesktopBridge {
  // Establish logical connection.
  rpc Connect(ConnectRequest) returns (ConnectResponse) {}

  // Application-level health check.
  rpc Heartbeat(imp.split_engine.HeartbeatRequest) returns (google.rpc.Status) {
  }

  // Send a request to the renderer.
  rpc SendRequest(imp.split_engine.SendRequestRequest)
      returns (imp.split_engine.SendRequestResponse) {}

  // Send message group to the renderer (client-side streaming)
  rpc SendMessageGroup(stream SendMessageGroupRequest)
      returns (SendMessageGroupResponse) {}

  // Reads message group completions from the server (server-side streaming).
  // See single machine proto for more details.
  rpc ReadMessageGroupCompletions(
      imp.split_engine.MessageGroupCompletionRequest)
      returns (stream imp.split_engine.MessageGroupCompletionResponse) {}
}

message ConnectRequest {}
message ConnectResponse {
  // Client shall use this ID for all subsequent requests.
  uint64 bridge_id = 1;
  // Client shall maintain heartbeats every `heartbeat_interval_ms`.
  uint64 heartbeat_interval_ms = 2;
  // Client shall not exceed this amount of outstanding message groups
  // (i.e., message groups that have not been completed by the server).
  uint64 max_outstanding_message_groups = 3;
}

message SendMessageGroupRequest {
  // Remains the same during the life of a stream
  uint64 bridge_id = 1;
  // Remains the same during the life of a stream
  uint64 group_id = 2;
  // Remains the same during the life of a stream
  uint64 group_max_size_bytes = 3;

  // Total amount of streamed data shall not exceed max_group_size_bytes.
  bytes partial_data = 4;
}

message SendMessageGroupResponse {}
