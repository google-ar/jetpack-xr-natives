syntax = "proto3";

package imp;

import "core/math/math.proto";

message FloatArray {
  repeated float values = 1;
}

message Float2Array {
  repeated Float2 values = 1;
}

message Float3Array {
  repeated Float3 values = 1;
}

message Float4Array {
  repeated Float4 values = 1;
}

message QuatfArray {
  repeated Quatf values = 1;
}
