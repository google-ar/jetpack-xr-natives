// LINT: LEGACY_NAMES
// Note: Legacy names are needed because filament uses lowerCamel casing for
// property names, and the proto field name has to exactly match the native_type
// property.
syntax = "proto3";

package imp;

import "core/proto/imp.proto";

// option cc_api_version = 2;
option java_package = "com.google.ar.imp.proto";

message Float2 {
  option (imp.native_type) = "::imp::float2";
  option (imp.native_include) = "core/math/vec.h";

  float x = 1;
  float y = 2;
}

message Float3 {
  option (imp.native_type) = "::imp::float3";
  option (imp.native_include) = "core/math/vec.h";

  float x = 1;
  float y = 2;
  float z = 3;
}

message Float4 {
  option (imp.native_type) = "::imp::float4";
  option (imp.native_include) = "core/math/vec.h";

  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Double2 {
  option (imp.native_type) = "::imp::double2";
  option (imp.native_include) = "core/math/vec.h";

  double x = 1;
  double y = 2;
}

message Double3 {
  option (imp.native_type) = "::imp::double3";
  option (imp.native_include) = "core/math/vec.h";

  double x = 1;
  double y = 2;
  double z = 3;
}

message Double4 {
  option (imp.native_type) = "::imp::double4";
  option (imp.native_include) = "core/math/vec.h";

  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Int2 {
  option (imp.native_type) = "::imp::int2";
  option (imp.native_include) = "core/math/vec.h";

  int32 x = 1;
  int32 y = 2;
}

message UInt2 {
  option (imp.native_type) = "::imp::uint2";
  option (imp.native_include) = "core/math/vec.h";

  uint32 x = 1;
  uint32 y = 2;
}

message Quatf {
  option (imp.native_type) = "::imp::quatf";
  option (imp.native_include) = "core/math/quat.h";

  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message Box {
  option (imp.native_type) = "::filament::Box";
  option (imp.native_include) =
      "filament/filament/include/filament/Box.h";

  Float3 center = 1;
  Float3 halfExtent = 2;
}

// Represents a 2x2 matrix of floats, convertible to ::imp::mat2f.
message Mat2f {
  option (imp.native_type) = "::imp::mat2f";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 2x2 matrix of floats.
  //
  // The floats are arranged in column major order:
  //   00 02
  //   01 03
  Float2 m0 = 1;
  Float2 m1 = 2;
}

// Represents a 2x2 matrix of doubles, convertible to ::imp::mat2.
message Mat2 {
  option (imp.native_type) = "::imp::mat2";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 2x2 matrix of doubles.
  //
  // The doubles are arranged in column major order:
  //   00 02
  //   01 03
  Double2 m0 = 1;
  Double2 m1 = 2;
}

// Represents a 3x3 matrix of floats, convertible to ::imp::mat3f.
message Mat3f {
  option (imp.native_type) = "::imp::mat3f";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 3x3 matrix of floats.
  //
  // The floats are arranged in column major order:
  //   00 03 06
  //   01 04 07
  //   02 05 08
  Float3 m0 = 1;
  Float3 m1 = 2;
  Float3 m2 = 3;
}

// Represents a 3x3 matrix of doubles, convertible to ::imp::mat3.
message Mat3 {
  option (imp.native_type) = "::imp::mat3";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 3x3 matrix of doubles.
  //
  // The doubles are arranged in column major order:
  //   00 03 06
  //   01 04 07
  //   02 05 08
  Double3 m0 = 1;
  Double3 m1 = 2;
  Double3 m2 = 3;
}

// Represents a 4x4 matrix of floats, convertible to ::imp::mat4f.
message Mat4f {
  option (imp.native_type) = "::imp::mat4f";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 4x4 matrix of floats.
  //
  // The floats are arranged in column major order:
  //   00 04 08 12
  //   01 05 09 13
  //   02 06 10 14
  //   03 07 11 15
  Float4 m0 = 1;
  Float4 m1 = 2;
  Float4 m2 = 3;
  Float4 m3 = 4;
}

// Represents a 4x4 matrix of doubles, convertible to ::imp::mat4.
message Mat4 {
  option (imp.native_type) = "::imp::mat4";
  option (imp.native_include) =
      "core/math/mat_proto_message.h";
  option (imp.no_codegen) = true;

  // A 4x4 matrix of doubles.
  //
  // The doubles are arranged in column major order:
  //   00 04 08 12
  //   01 05 09 13
  //   02 06 10 14
  //   03 07 11 15
  Double4 m0 = 1;
  Double4 m1 = 2;
  Double4 m2 = 3;
  Double4 m3 = 4;
}
