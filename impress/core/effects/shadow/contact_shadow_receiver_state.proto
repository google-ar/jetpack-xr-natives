syntax = "proto3";

package imp;

// Receives shadows from the projector of a given target group.
// Will try to apply the shadows to a sampler2D parameter
// if it finds a material on a MeshRenderer on the same node.
message ContactShadowReceiverState {
  // The target group should be the name of the group
  // that an existing contact shadow projector is already assigned to.
  string target_group = 1;
  // The parameter name should be for a material
  // on a render component on the same object.
  // The parameter should be for a sampler2D.
  string shadow_parameter_name = 2;
}
