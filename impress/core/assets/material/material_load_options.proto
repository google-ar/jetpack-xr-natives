syntax = "proto3";

package imp;

// Specifies the material variants to pre-compile.
// See filament::UserVariantFilterBit for more information.
// The DEFAULT can be set for each variant at runtime.
message MaterialPreCompileVariants {
  enum VariantPreCompileMode {
    DEFAULT = 0;
    EXCLUDED = 1;
    LOW_PRIORITY = 2;
    HIGH_PRIORITY = 3;
  }

  VariantPreCompileMode directional_lighting = 1;
  VariantPreCompileMode dynamic_lighting = 2;
  VariantPreCompileMode shadow_receiver = 3;
  VariantPreCompileMode skinning = 4;
  VariantPreCompileMode fog = 5;
  VariantPreCompileMode vsm = 6;  // Variance shadow maps
  VariantPreCompileMode ssr = 7;  // Screen-space reflections
  VariantPreCompileMode ste = 8;  // Instanced stereo rendering
}

// A material constant:
// https://google.github.io/filament/Materials.html#materialdefinitions/materialblock/general:constants
message MaterialPreCompileConstant {
  string name = 1;
  oneof value {
    int32 int_value = 2;
    float float_value = 3;
    bool bool_value = 4;
  }
}

// Specifies the material pre-compile options.
message MaterialPreCompileOptions {
  MaterialPreCompileVariants variants = 1;
  repeated MaterialPreCompileConstant constants = 3;
  optional int32 spherical_harmonics_bands = 4;  // Default is 3.

  enum ShadowSamplingQuality {
    SHADOW_SAMPLING_QUALITY_UNSPECIFIED = 0;
    // 2x2 PCF. Faster but lower quality.
    SHADOW_SAMPLING_QUALITY_HARD = 1;
    // 3x3 gaussian filter. Default.
    SHADOW_SAMPLING_QUALITY_LOW = 2;
  }
  // Default is `SHADOW_SAMPLING_QUALITY_LOW` when set to
  // `SHADOW_SAMPLING_QUALITY_UNSPECIFIED`.
  ShadowSamplingQuality shadow_sampling_quality = 5;
}
