syntax = "proto3";

package imp;

option java_multiple_files = true;
// option cc_api_version = 2;
// option cc_api_version = 2;

// Represents an input pointer event
message KeyboardEventMessage {
  // Lists the different possible input keyboard event types
  enum KeyboardEventTypeMessage {
    NONE = 0;
    // One key is pushed
    DOWN = 1;
    // One key is released
    UP = 2;
  }
  KeyboardEventTypeMessage type = 1;
  string code = 2;  // Name of physical key that is pressed.
  string key = 3;   // Generated text character or name of the functional key.
  bool alt_key = 4;
  bool shift_key = 5;
  bool ctrl_key = 6;
  bool super_key = 7;
}
