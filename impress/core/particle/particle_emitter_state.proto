syntax = "proto3";

package imp;

import "core/particle/particle_config.proto";

// Wrapper for a ParticleConfig, it includes the emitter specific weight that
// indicates the relative frequency when multiple particles types are being
// emitted.
// Next ID: 3
message WeightedParticleState {
  // The particle configuration itself.
  ParticleConfig config = 1;

  // The relative weight of this particle type. If no weight is specified, the
  // default value of 1.0 will be used. This means if no weights are specified
  // for any particle in an EmitterConfig, they will all be emitted in roughly
  // equal numbers. Weights will be normalized before use.
  optional float weight = 2;
}

// Configuration information that describes how a type of particle should be
// created and emitted by a ParticleEmitter.
// Next ID: 6
message ParticleEmitterState {
  // Definition of the different rendering pathways available for particles.
  enum ParticleRenderer {
    // Billboard and static mesh particles be fully owned by the emitter.
    // Will using Filament's instancing API to render copies of the particles.
    PARTICLE_RENDERER_DRAW_DEFAULT = 0;

    // Node particles will be rendered by their assigned MeshRenderer. The
    // emitter will update the state on the node directly each frame.
    PARTICLE_RENDERER_NODE = 1;
  }

  // The length of time, in seconds, that the emitter should remain active.
  optional float duration_in_seconds = 1;

  // Indicates the emitter will restart after the duration has elapased?
  optional bool loop = 2;

  // The maximum number of particles that may be active at any given time.
  optional int32 max_particles = 3;

  // Defines how the particles will be rendered, see the ParticleRenderer
  // definition above for more details.
  ParticleRenderer renderer = 4;

  // Configurations for the particles to emit. The weights are used to determine
  // the relative frequency of each particle type. The weights do not need to
  // sum to 1.0.
  repeated WeightedParticleState weighted_particle_states = 5;
}
