syntax = "proto3";

package imp;

import "core/view/framework/animation/animation.proto";

// Describes an animation curve with a set of floating point scalar values
// representing linear time in seconds, a set of vectors or scalars
// representing the value of the animated property, and a desired interpolation
// algorithm.
message AnimationSampler {
  // Animation times in seconds.
  repeated float times_seconds = 1;
  // Animation values that correspond to each time. This defines the param
  // type for the animate_fn lambda in PropertyAnimator.
  AnimationValues values_array = 2;
  // Animation interpolation mode. Defaults to linear.
  InterpolationMode interpolation = 3;
}

// Component for controlling dynamic animations in the scene.
// PropertyAnimatorState allows for specifying curves through the
// AnimationSampler field. However, targeting the animation values requires
// an animate_fn lambda to be connected through the PropertyAnimator::Create
// call and specifying which sampler values to use by AnimationSampler name.
message PropertyAnimatorState {
  // Map of unique names to AnimationSamplers.
  map<string, AnimationSampler> samplers = 1;
}
