syntax = "proto3";

package imp.editor;

import "core/math/math.proto";
import "core/scene_handles/scene_handles.proto";

enum TransformAspect {
  TRANSFORM_ASPECT_TRANSLATE = 0;
  TRANSFORM_ASPECT_ROTATE = 1;
  TRANSFORM_ASPECT_SCALE = 2;
}

message TransformWidgetAspectState {
  option (imp.native_include) =
      "core/editor/widgets/transform_widget_mode_control.h";

  Float3 axis = 1;
  TransformAspect aspect = 2;
  ComponentSceneHandle transform_widget_mode_control = 3
      [(imp.template_type) = "TransformWidgetModeControl"];
}
