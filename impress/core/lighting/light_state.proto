syntax = "proto3";

package imp;

import "core/math/math.proto";
import "core/proto/imp.proto";

option java_multiple_files = true;
option java_outer_classname = "LightStateOuterClass";

// Serialized data for LightComponent.
// TODO: Add missing remaining filament light properties.
message LightState {
  enum Type {
    // Directional light, emits light in a given direction.
    DIRECTIONAL = 0;
    // Directional light that also draws a sun's disk in the sky.
    SUN = 1;
    // Point light, emits light from a position, in all directions.
    POINT = 2;
    // Spot light with coupling of outer cone and illumination disabled.
    FOCUSED_SPOT = 3;
    // Physically correct spot light.
    SPOT = 4;
  }

  // Determines the type of light.
  Type type = 1;

  // The color of the light.
  // The color is returned in the linear sRGB color-space.
  // When making a LightComponent dynamically, the default is white.
  // filament::Color contains some conversion helpers.
  // TODO Create an ImpView color type.
  Float3 color = 2 [(imp.editor_control) = { color_picker_3: {} }];

  // The light's intensity in lumen.
  //
  // This parameter depends on the light type:
  //  - For directional lights, it specifies the illuminance in *lux*
  //    (or *lumen/m^2*).
  //  - For point lights and spot lights, it specifies the luminous power
  //    in *lumen*.
  // When making a LightComponent dynamically, the default is 100000.
  float intensity = 3;

  // Determines if this light should not cast shadows.
  // Only DIRECTIONAL and SUN lights can cast shadows.
  bool is_shadow_casting_disabled = 4;

  // Falloff distance for point lights and spot lights.
  // The influence of the light diminishes to zero as it approaches the falloff.
  // When making a LightComponent dynamically, the default is 1.
  float falloff = 5;

  // Inner and outer cone angles for spot lights.
  Float2 spot_cone_inner_outer = 6;

  // Transforms the shadow direction. Ignored if the light type isn't
  // directional. This transform is applied on top of the directional light's
  // direction. For artistic use. Use with caution.
  Quatf shadow_transform = 7 [(imp.optional_type) = ABSL_OPTIONAL];

  // Size of the shadow map in texels. Must be a power-of-two and larger or
  // equal to 8. This only affect directional lights. Defaults to 1024.
  optional int32 shadow_map_size = 8;

  // Constant bias in world units (e.g. meters) by which shadows are moved away
  // from the light. 1mm by default. This is ignored when the View's ShadowType
  // is set to VSM.
  float shadow_constant_bias = 15;

  // Amount by which the maximum sampling error is scaled. The resulting value
  // is used to move the shadow away from the fragment normal. Should be 1.0.
  // This is ignored when the View's ShadowType is set to VSM.
  float shadow_normal_bias = 16;

  // Distance from the camera after which shadows are clipped. This is used to
  // clip shadows that are too far and wouldn't contribute to the scene much,
  // improving performance and quality. This value is always positive. Use 0.0f
  // to use the camera far distance. This only affect directional lights.
  float shadow_far = 9;

  // Controls whether the shadow map should be optimized for resolution or
  // stability. When set to true, all resolution enhancing features that can
  // affect stability are disabling, resulting in significantly lower resolution
  // shadows, albeit stable ones. This only affect directional lights.
  bool shadow_stable = 10;

  // Whether to enable light-space perspective shadow-mapping, or LiSPSM.
  // Enabling it will apply a perspective transform to shadow mapping, which
  // allocates more pixels closer to camera and improves the shadow resolution
  // similar to shadow cascade. Only effective when shadow_stable is false.
  //
  // Default to true. You might consider disabling it if the following applies:
  //   1. You're using ShadowType::VSM with a large blur, or ShadowType::PCSS
  //      and running into blurring artifacts.
  //   2. You have a "telesopic" camera with small FOV & looking at objects far
  //      away from the camera. This is because LiSPSM applies more pixels to
  //      the camera location, instead of where the camera is looking at.
  bool shadow_lispsm = 11;

  // Number of shadow cascades to use for this light. Must be between 1 and 4
  // (inclusive). A value greater than 1 turns on cascaded shadow mapping (CSM).
  // This only affect directional lights.
  int32 shadow_cascade_count = 12;

  // Method to compute split positions for shadow cascades.
  enum ShadowCascadeSplitScheme {
    // Split uniformly among cascades.
    UNIFORM = 0;
    // Split logarithmically over distance.
    LOG = 1;
    // Split using a lambda value to interpolate between the log and uniform
    // split schemes.
    PRACTICAL = 2;
  }
  ShadowCascadeSplitScheme shadow_cascade_split_scheme = 13;

  // The lambda value to use for the practical shadow cascade split scheme.
  // Ignored if shadow_cascade_split_scheme is not set to practical.
  float shadow_cascade_practical_lambda = 14
      [(imp.editor_control) = { slider_float: { min: 0 max: 1 precision: 2 } }];
}
