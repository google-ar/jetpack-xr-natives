syntax = "proto3";

package imp;

// Serialized data for VideoPlayer
message VideoPlayerState {
  // Determines whether the component will create a quad or try to use an
  // existing quad.
  enum QuadMode {
    NONE = 0;
    CREATE = 1;
  }

  // The path (file or url) to a video file.
  string asset = 1;
  // The mode (whether or not to create a quad for the video).
  QuadMode mode = 2;
}
