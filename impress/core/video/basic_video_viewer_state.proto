syntax = "proto3";

package imp;

// Serialized data for BasicVideoViewer.
message BasicVideoViewerState {
  // The path (file or url) to a video file.
  string asset = 1;

  // Custom material the user may want to use.
  optional string custom_material = 2;

  // DRM license's URL.
  optional string drm_license_url = 3;

  // DRM scheme UUID.
  optional string drm_scheme_uuid = 4;
}
