edition = "2024";

package test;

import "core/proto/test.proto";
import "core/proto/test_standard.proto";

import option "core/proto/imp.proto";

option (imp.impress_append_namespace) = true;

message TestEdition2024Message {
  message TestNestedMessage {
    int32 int_field = 1;
    string string_field = 2;
  }

  enum TestEnum {
    DEFAULT = 0;
    FIRST_VALUE = 1;
    SECOND_VALUE = 2;
  }

  double double_field = 1;
  double double_field_with_default = 2 [default = 1.3];
  double double_field_no_presence = 3 [features.field_presence = IMPLICIT];

  float float_field = 4;
  float float_field_with_default = 5 [default = 1.3];
  float float_field_no_presence = 6 [features.field_presence = IMPLICIT];

  int32 int32_field = 7;
  int32 int32_field_with_default = 8 [default = 1];
  int32 int32_field_no_presence = 9 [features.field_presence = IMPLICIT];

  int64 int64_field = 10;
  int64 int64_field_with_default = 11 [default = 1];
  int64 int64_field_no_presence = 12 [features.field_presence = IMPLICIT];

  sint32 sint32_field = 19;
  sint32 sint32_field_with_default = 20 [default = 1];
  sint32 sint32_field_no_presence = 21 [features.field_presence = IMPLICIT];

  sint64 sint64_field = 22;
  sint64 sint64_field_with_default = 23 [default = 1];
  sint64 sint64_field_no_presence = 24 [features.field_presence = IMPLICIT];

  sfixed32 sfixed32_field = 31;
  sfixed32 sfixed32_field_with_default = 32 [default = 1];
  sfixed32 sfixed32_field_no_presence = 33 [features.field_presence = IMPLICIT];

  sfixed64 sfixed64_field = 34;
  sfixed64 sfixed64_field_with_default = 35 [default = 1];
  sfixed64 sfixed64_field_no_presence = 36 [features.field_presence = IMPLICIT];

  bool bool_field = 37;
  bool bool_field_with_default = 38 [default = true];
  bool bool_field_no_presence = 39 [features.field_presence = IMPLICIT];

  string string_field = 40;
  string string_field_with_default = 41 [default = "default"];
  string string_field_no_presence = 42 [features.field_presence = IMPLICIT];

  bytes bytes_field = 43;
  bytes bytes_field_with_default = 44 [default = "default_bytes"];
  bytes bytes_field_no_presence = 45 [features.field_presence = IMPLICIT];

  TestEnum enum_field = 46;
  TestEnum enum_field_with_default = 47 [default = FIRST_VALUE];
  TestEnum enum_field_no_presence = 48 [features.field_presence = IMPLICIT];

  map<int32, string> map_field = 49;

  repeated int32 repeated_int_field = 50;

  TestNestedMessage nested_message = 51;
  TestNestedMessage nested_message_with_default = 52
      [(imp.msg_default) = "{.int_field = 1, .string_field = \"hello\"}"];
}

message TestEdition2024MessageWithStandardProto {
  StandardMessage standard_msg = 1 [(imp.is_imported_standard_proto) = true];

  oneof variant {
    int32 i32 = 2;
    StandardMessage oneof_msg = 3 [(imp.is_imported_standard_proto) = true];
  }

  StandardMessage.NestedMessage nested_msg = 4
      [(imp.is_imported_standard_proto) = true];
}

message NativeMessageWithPresenceNoCodegen {
  option (imp.native_type) = "test::NativeWithPresenceNoCodegen";
  option (imp.native_include) = "core/proto/test_native.h";
  option (imp.native_type_has_presence) = true;
  option (imp.no_codegen) = true;

  int32 i32 = 1;
}

message TestEdition2024MessageWithNativeType {
  NativeMessage native_msg = 1;
  NativeMessageWithPresenceNoCodegen native_msg_with_presence_no_codegen = 2;
}
